# Publica en npmjs.com con Trusted Publishing (OIDC): sin token ni 2FA.
# Requiere configurar en npmjs.com → paquete → Settings → Trusted Publisher:
#   GitHub Actions · D4vRAM369 / pbl-project-chronicler · publish-npm.yml
# Se lanza al subir un tag v* (o a mano desde Actions).
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: GitHub demuestra a npm quién es este workflow

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing exige npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm --version
      # Sin NODE_AUTH_TOKEN: la provenance se genera sola con OIDC
      - run: npm publish --access public
